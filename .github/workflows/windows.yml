name: Windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests del núcleo
        run: dotnet test windows/tests/Dicta.Core.Tests -c Release

      - name: Publicar (win-x64, autónomo)
        run: dotnet publish windows/src/Dicta -c Release -o windows/publish

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $env:DICTA_VERSION = if ($tag) { $tag.TrimStart('v') } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc windows\installer\Dicta.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Dicta-Setup
          path: windows/out/Dicta-Setup.exe

      - name: Adjuntar a la versión publicada
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" windows/out/Dicta-Setup.exe --clobber
